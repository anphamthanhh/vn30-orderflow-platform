# ob_depth_resid_imb_ratio_v1: signed bid/offer tilt of the depth beyond the ten published levels.
#   hidden_bid   = total_bid_qty   - sum(bid_volumes[1..10])
#   hidden_offer = total_offer_qty - sum(offer_volumes[1..10])
#   value        = (hidden_bid - hidden_offer) / (hidden_bid + hidden_offer)

# Not a generic "imbalance": it uses the residual depth and does not clip its denominator,
# unlike the other order-book imbalance formulas (e.g. orderflow-engine/src/imbalance.rs).
schema: l2.feature/1
feature: ob_depth_resid_imb_ratio_v1
family: ob
title: Signed bid-vs-offer tilt of the depth beyond the ten published levels
unit: ratio
dtype: float64
cadence: m1

signal:
  causal: true
  lookahead_ms: 0
  window_start_rule: bar_open
  event_time_rule: bar_close
  is_final_rule: every_bar

inputs:
  - layer: L0
    table: default.vn30f_orderbook
    columns:
      [event_timestamp, bid_volumes, offer_volumes, total_bid_qty, total_offer_qty]
depends_on: []

params:
  default:
    cadence: m1
    symbol_scope: single
    session_reset: none
    seam_13h: none
    warmup_bars: 0
    levels: 10
    agg: last
    stale_ms: 0

impl:
  rust: null
  python: historical/l2/producers/book_cost.py::hidden_imb_ratio
  authority: python

parity:
  tolerance: 0
  tolerance_reason: null
  golden_tape: historical/tests/fixtures/book_cost_book_synthetic_20210304_20210305.csv
  test: historical/tests/test_l2_book_cost.py::test_hidden_imb_ratio_matches_hand_computed_golden_vector
  parity_waiver: >-
    No Rust implementation of this quantity exists. orderflow-engine/src/imbalance.rs is a
    per-LEVEL, UNSIGNED ratio against max(bid, ask, 1.0) with the direction in a separate
    enum, computed on visible levels; it is neither this numerator nor this denominator
    nor this sign convention, and it never touches total_*_qty. Pointing impl.rust at it
    to obtain a parity test would be the four-formulas-one-name defect committed on
    purpose. Replaced by: a hand-computed golden vector reducing to an exact dyadic
    fraction (17/64) so the expected value is derivable on paper rather than read back
    from the function; a property test that the value stays within [-1, 1] and that its
    sign follows the larger hidden side across every state of the frozen fixture (6,581 real states in the original); and a mutation test
    that swaps the two sides in the numerator, which flips every non-zero value's sign.

derives_trigger: null
maps_to_validation_state: offline-replayed

status: PARITY
pinned_code_version: null
supersedes: null
superseded_by: null
retention: unbounded
note: >-
  Returns 0.0 when neither side has any hidden size at all, so "no evidence" and "balanced
  evidence" read alike. The alternative - NaN - would silently drop the row out of any
  downstream mean and turn a measurable state into a missing one. Never observed on real
  data (hidden > 0 on 6,581/6,581 rows of the original real fixture).
next_action: >-
  Owed: `agg: median` needs a feature_boundary vocabulary change. Whether this tilt
  relates to cost or fill probability is NOT measured here and no such claim is made -
  that is a card's question, not a feature spec's.
