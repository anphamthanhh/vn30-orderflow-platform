# ob_depth_resid_lot_v1: mean per-side size resting beyond the ten published levels, in lots.
#   hidden_bid   = total_bid_qty   - sum(bid_volumes[1..10])
#   hidden_offer = total_offer_qty - sum(offer_volumes[1..10])
#   value        = 0.5 * (hidden_bid + hidden_offer)

# The venue has no hidden or iceberg order type, so the name states the arithmetic: the
# residual between the feed's reported totals and the published levels.
schema: l2.feature/1
feature: ob_depth_resid_lot_v1
family: ob
title: Per-side depth beyond the ten published levels, end-of-minute
unit: lot
dtype: float64
cadence: m1

signal:
  causal: true
  lookahead_ms: 0
  window_start_rule: bar_open
  event_time_rule: bar_close
  is_final_rule: every_bar

inputs:
  - layer: L0
    table: default.vn30f_orderbook
    columns:
      [event_timestamp, bid_volumes, offer_volumes, total_bid_qty, total_offer_qty]
depends_on: []

params:
  default:
    cadence: m1
    symbol_scope: single
    session_reset: none
    seam_13h: none
    warmup_bars: 0
    levels: 10                  # published levels subtracted from the totals
    agg: last
    stale_ms: 0

impl:
  rust: null
  python: historical/l2/producers/book_cost.py::hidden_lot
  authority: python

parity:
  tolerance: 0                  # integer arithmetic; 0.5 * integer is exact in f64
  tolerance_reason: null
  golden_tape: historical/tests/fixtures/book_cost_book_synthetic_20210304_20210305.csv
  test: historical/tests/test_l2_book_cost.py::test_hidden_lot_matches_hand_computed_golden_vector
  parity_waiver: >-
    No Rust implementation exists, and no Rust code anywhere in native_platform subtracts
    the summed levels from total_bid_qty / total_offer_qty - the two quantities are
    carried side by side through market-types, market-dom-engine and the desktop client
    and are never differenced. There is therefore no second implementation for a
    cross-stack diff to run against. Replaced by: a hand-computed golden vector whose
    every intermediate integer is written out in the named test; a property test that
    hidden >= 0 on every state of the frozen fixture (6,581/6,581 on the original real one, matching
    420,987/420,987 over a full session); and the mutation this formula is most likely to
    suffer - substituting the top-10 sum for total_*_qty, which collapses every value to
    exactly 0 and is what the test asserts does NOT happen.

derives_trigger: null
maps_to_validation_state: offline-replayed

status: PARITY
pinned_code_version: null
supersedes: null
superseded_by: null
retention: unbounded
note: >-
  NOT clamped at zero. A negative value would mean the venue published a whole-book total
  smaller than the ten levels it also published - a feed contradicting itself - and
  max(0, ...) would turn that into a plausible number. It has never been observed
  (0 occurrences in 420,987 rows, 0 in the fixture), which is exactly why the day it
  happens it must be visible.
next_action: >-
  Owed: `agg: median` needs a feature_boundary vocabulary change. Also worth measuring
  separately, and deliberately NOT measured here: whether hidden depth moves with cost or
  with fill probability. This branch builds features and makes no predictive claim; that
  question belongs to a card with a registered spec, not to a spec file.
